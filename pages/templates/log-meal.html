{% extends 'base.html' %}

{% load static %}

{% block title %} Log a Meal - My Wellness {% endblock %}

{% block hero-h1 %} Log a Meal {% endblock %}
{% block hero-paragraph %} Use this form as a front-end practice example. It does not save data yet.{% endblock %}

{%block content %}

    <section class="page-section form-layout">

        <form class="form-card" action="#" method="post">
            <label for="meal-name">Meal name</label>
            <input type="text" id="meal-name" name="meal-name" placeholder="Example: Breakfast" required>

            <label for="calories">Calories</label>
            <input type="number" id="calories" name="calories" min="0" required>

            <label for="meal-type">Meal type</label>
            <select id="meal-type" name="meal-type">
                <option>Breakfast</option>
                <option>Lunch</option>
                <option>Dinner</option>
                <option>Snack</option>
            </select>

            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="4" placeholder="Write a short note"></textarea>

            <button class="btn" type="submit">Save Meal</button>
        </form>
    </section>

{% endblock %}
