<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - My Wellness</title>
    <link rel="stylesheet" href="../layout-flex.css">
    <!-- <link rel="stylesheet" href="../layout-grid.css"> -->
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header">
            <div class="logo">
                <img src="../images/logo.svg" alt="My Wellness logo">
                <span>My Wellness</span>
            </div>
            <nav class="main-nav">
                <a href="../index.html">Home</a>
                <a href="../about.html">About</a>
                <a href="../meals.html">Meals</a>
                <a href="../log-meal.html">Log Meal</a>
            </nav>
        </header>

        <main>
            <section class="page-section form-layout">
                <div>
                    <h1>Contact Us</h1>
                    <p>Practice a contact form with labels, inputs, and a textarea.</p>
                </div>

                <form class="form-card" action="#" method="post">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <button class="btn" type="submit">Send Message</button>
                </form>
            </section>
        </main>

        <footer class="site-footer">
            <p>&copy; 2025 My Wellness</p>
        </footer>
    </div>
</body>
</html>
